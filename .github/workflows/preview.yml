name: Preview

# Deploys each PR's build to Cloudflare Pages as a preview, and links it from
# the PR's "View deployment" button, which posts no comment. Deploying under
# the branch `pr-<number>` keeps one stable URL per PR across pushes.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Preview
    runs-on: ubuntu-latest
    # A fork PR gets no secrets, so it can't upload.
    if: github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: preview
      url: ${{ steps.upload.outputs.url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build project
        run: pnpm build

      - name: Deploy preview
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pnpm exec wrangler pages deploy --branch="pr-$PR_NUMBER"
          # The branch alias (pr-<number>.womanhoodofwubz.pages.dev) stays the
          # same across pushes; the per-deploy URL is the fallback.
          url=$(jq -r 'select(.type == "pages-deploy-detailed") | .alias // .url // empty' "$WRANGLER_OUTPUT_FILE_PATH")
          if [ -z "$url" ]; then
            echo "::error::No preview URL returned by wrangler pages deploy."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "**Preview:** $url" >> "$GITHUB_STEP_SUMMARY"
