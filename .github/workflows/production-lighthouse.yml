name: Production Lighthouse

# Polls for a live deploy after a push to master (since publishing does not
# occur in GitHub), then runs the audit if one lands. If no deploy shows up,
# the run is cancelled instead of failing.

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      target_url:
        description: URL to audit
        required: false
        default: https://womanhoodofwubz.neocities.org/

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PLAYWRIGHT_BASE_URL: ${{ github.event.inputs.target_url || 'https://womanhoodofwubz.neocities.org/' }}

    steps:
      - name: Wait for deploy
        id: poll
        uses: bvandrc/poll-for-deploy@v1
        with:
          url: ${{ env.PLAYWRIGHT_BASE_URL }}

      - name: Cancel run (no deploy detected)
        if: steps.poll.outputs.deployed != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });

      - name: Checkout repo
        if: steps.poll.outputs.deployed == 'true'
        uses: actions/checkout@v7

      - name: Setup
        if: steps.poll.outputs.deployed == 'true'
        uses: ./.github/actions/setup

      - name: Setup Playwright
        if: steps.poll.outputs.deployed == 'true'
        uses: ./.github/actions/setup-playwright

      - name: Check target URL is reachable
        if: steps.poll.outputs.deployed == 'true'
        uses: jtalk/url-health-check-action@v5
        with:
          url: ${{ env.PLAYWRIGHT_BASE_URL }}
          max-attempts: 10
          retry-delay: 10s
          retry-all: true

      - name: Run Lighthouse audits
        if: steps.poll.outputs.deployed == 'true'
        run: pnpm test:lighthouse:production

      - name: Upload reports
        if: always() && steps.poll.outputs.deployed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: playwright/results
          if-no-files-found: ignore
